<svg xmlns="http://www.w3.org/2000/svg" width="480" height="39" viewBox="0 0 480 39" shape-rendering="crispEdges">
<style>
.move{animation:move 7s cubic-bezier(.55,0,.85,.4) infinite}
.fade{animation:fade 7s linear infinite}
.wa{animation:wa .16s steps(1) infinite}
.wb{animation:wb .16s steps(1) infinite}
.p{animation:drift 1.2s ease-in-out infinite alternate}
.p1,.p4{animation-delay:-.4s}
.p2,.p5{animation-delay:-.8s}
@keyframes move{0%{transform:translateX(4px)}92%,100%{transform:translateX(356px)}}
@keyframes fade{0%{opacity:0}12%{opacity:1}80%{opacity:1}92%,100%{opacity:0}}
@keyframes wa{0%{opacity:1}50%{opacity:0}}
@keyframes wb{0%{opacity:0}50%{opacity:1}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-4px)}}
@media (prefers-reduced-motion:reduce){
.move,.fade,.wa,.wb,.p{animation:none}
.move{transform:translateX(180px)}
.wb,.p{opacity:0}
}
</style>
